  <style>
    :root,
    [data-theme="dark"] {
      --bg-app: #061815;
      --bg-card: #0b2420;
      --bg-elevated: #10312b;
      --bg-hover: #163e37;
      --text-primary: #f4f7f5;
      --text-secondary: #9cb5ae;
      --accent: #18a57a;
      --accent-hover: #128763;
      --accent-soft: rgba(24, 165, 122, 0.16);
      --gold: #d9ad5b;
      --gold-soft: rgba(217, 173, 91, 0.16);
      --border-color: #1a4038;
      --shadow-card: 0 14px 36px rgba(0, 0, 0, 0.35);
    }

    [data-theme="light"] {
      --bg-app: #f3efe6;
      --bg-card: #fcfaf5;
      --bg-elevated: #f5efe2;
      --bg-hover: #ebe2d0;
      --text-primary: #152520;
      --text-secondary: #5a6a64;
      --accent: #0f6249;
      --accent-hover: #0a4b37;
      --accent-soft: rgba(15, 98, 73, 0.11);
      --gold: #b48536;
      --gold-soft: rgba(180, 133, 54, 0.16);
      --border-color: #dfd4be;
      --shadow-card: 0 10px 28px rgba(45, 34, 14, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      font-family: "Cairo", system-ui, -apple-system, sans-serif;
      background-color: var(--bg-app);
      color: var(--text-primary);
      margin: 0;
      min-height: 100vh;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .quran-calligraphy {
      font-family: "Amiri Quran", "Traditional Arabic", serif;
    }

    .card-surface {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-card);
    }

    .elevated-surface {
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-color);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
      color: #ffffff;
      transition: transform 0.12s ease, opacity 0.15s ease;
    }

    .btn-primary:hover { opacity: 0.94; }
    .btn-primary:active { transform: scale(0.96); }

    .btn-subtle {
      background-color: transparent;
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .btn-subtle:hover { background-color: var(--bg-hover); }

    .reciter-card {
      background-color: var(--bg-card);
      border: 1.5px solid var(--border-color);
      transition: border-color 0.2s ease, background-color 0.2s ease, transform 0.15s ease;
    }

    .reciter-card.is-selected {
      border-color: var(--gold);
      background: linear-gradient(135deg, var(--gold-soft) 0%, var(--bg-card) 60%, var(--accent-soft) 100%);
    }

    .surah-row {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .surah-row:hover { background-color: var(--bg-elevated); }

    .surah-row.is-playing {
      border-color: var(--gold);
      background-color: var(--accent-soft);
    }

    .tab-active {
      background-color: var(--accent);
      color: #ffffff;
    }

    .tab-inactive {
      background-color: transparent;
      color: var(--text-secondary);
    }

    .tab-inactive:hover {
      background-color: var(--bg-hover);
      color: var(--text-primary);
    }

    input[type="range"].seek-bar {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: var(--border-color);
      outline: none;
      cursor: pointer;
    }

    input[type="range"].seek-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--gold);
      border: 2px solid #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    @keyframes eqBounce {
      0%, 100% { height: 6px; }
      50% { height: 20px; }
    }

    .eq-bar {
      width: 3px;
      border-radius: 999px;
      background-color: var(--gold);
      height: 6px;
    }

    .is-animating .eq-bar:nth-child(1) { animation: eqBounce 0.7s ease-in-out infinite; }
    .is-animating .eq-bar:nth-child(2) { animation: eqBounce 0.55s ease-in-out 0.15s infinite; }
    .is-animating .eq-bar:nth-child(3) { animation: eqBounce 0.8s ease-in-out 0.3s infinite; }
    .is-animating .eq-bar:nth-child(4) { animation: eqBounce 0.6s ease-in-out 0.1s infinite; }

    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-thumb {
      background-color: var(--border-color);
      border-radius: 999px;
    }
  </style>
</head>

  <header class="sticky top-0 z-30 border-b px-4 py-3 backdrop-blur-md" style="background-color: var(--bg-card); border-color: var(--border-color);">

      const state = {

      function toArabicDigits(n) {
        return String(n).replace(/\d/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'[Number(d)]; });
      }

      function pad3(n) {
        return String(n).padStart(3, '0');
      }

      function normalizeArabic(str) {
        return String(str || '').replace(/[ً-ٟ]/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').trim();
      }

      function formatTime(sec) {
        if (!isFinite(sec) || sec < 0) return '00:00';
        var s = Math.floor(sec);
        var h = Math.floor(s / 3600);
        var m = Math.floor((s % 3600) / 60);
        var r = s % 60;
        var mm = String(m).padStart(2, '0');
        var rr = String(r).padStart(2, '0');
        return h > 0 ? (h + ':' + mm + ':' + rr) : (mm + ':' + rr);
      }

      var toastTimer = null;
      function showToast(msg) {
        els.toast.textContent = msg;
        els.toast.classList.remove('hidden');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { els.toast.classList.add('hidden'); }, 2600);
      }

      function savePrefs() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            reciter: state.reciter,
            surahNum: state.surahNum,
            theme: state.theme,
            repeatMode: state.repeatMode,
            favorites: state.favorites,
            downloadedMap: state.downloadedMap
          }));
        } catch (e) {}
      }

      function loadPrefs() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return;
          var p = JSON.parse(raw);
          if (p.reciter && RECITERS[p.reciter]) state.reciter = p.reciter;
          if (p.surahNum >= 1 && p.surahNum <= 114) state.surahNum = p.surahNum;
          if (p.theme === 'dark' || p.theme === 'light') state.theme = p.theme;
          if (typeof p.repeatMode === 'number') state.repeatMode = p.repeatMode;
          if (Array.isArray(p.favorites)) state.favorites = p.favorites;
          if (p.downloadedMap && typeof p.downloadedMap === 'object') state.downloadedMap = p.downloadedMap;
        } catch (e) {}
      }

      function dlKey(reciter, surahNum) {
        return reciter + ':' + surahNum;
      }

      function isSurahOffline(reciter, surahNum) {
        if (window.AndroidQuranAudio && typeof window.AndroidQuranAudio.isDownloaded === 'function') {
          try {
            if (window.AndroidQuranAudio.isDownloaded(reciter, pad3(surahNum))) return true;
          } catch (e) {}
        }
        return !!state.downloadedMap[dlKey(reciter, surahNum)];
      }

      async function syncOfflineInventory() {
        // 1. Check Android native bundled & saved files
        if (window.AndroidQuranAudio && typeof window.AndroidQuranAudio.listDownloaded === 'function') {
          try {
            var csv = window.AndroidQuranAudio.listDownloaded(state.reciter);
            if (csv) {
              csv.split(',').forEach(function (n) {
                var num = parseInt(n, 10);
                if (num >= 1 && num <= 114) state.downloadedMap[dlKey(state.reciter, num)] = true;
              });
            }
          } catch (e) {}
        }
        // 2. Check Browser Cache API
        if ('caches' in window) {
          try {
            var cache = await caches.open(CACHE_NAME);
            var keys = await cache.keys();
            keys.forEach(function (req) {
              var m = req.url.match(/\/([a-z_]+)\/(\d{3})\.mp3$/);
              if (m) {
                state.downloadedMap[dlKey(m[1], parseInt(m[2], 10))] = true;
              }
            });
          } catch (e) {}
        }
        renderList();
        updatePlayerHeader();
      }

      function getRemoteUrls(reciterId, surahNum) {
        var rec = RECITERS[reciterId] || RECITERS.sudais;
        var file = pad3(surahNum) + '.mp3';
        return rec.mirrors.map(function (base) { return base + file; });
      }

      async function playSurah(surahNum, autoPlay) {
        state.surahNum = Math.max(1, Math.min(114, surahNum));
        savePrefs();
        updatePlayerHeader();
        renderList();

        if (state.activeBlobUrl) {
          URL.revokeObjectURL(state.activeBlobUrl);
          state.activeBlobUrl = null;
        }

        var candidates = [];
        var recId = state.reciter;
        var sPad = pad3(state.surahNum);

        // 1. Native Android offline file / bundled APK asset
        if (window.AndroidQuranAudio && typeof window.AndroidQuranAudio.getLocalUrl === 'function') {
          try {
            var localPath = window.AndroidQuranAudio.getLocalUrl(recId, sPad);
            if (localPath) candidates.push(localPath);
          } catch (e) {}
        }

        // 2. Browser Cache API offline copy
        if (!candidates.length && 'caches' in window) {
          try {
            var cache = await caches.open(CACHE_NAME);
            var cachedKey = new Request('https://offline.quran.local/' + recId + '/' + sPad + '.mp3');
            var cachedResp = await cache.match(cachedKey);
            if (cachedResp) {
              var blob = await cachedResp.blob();
              state.activeBlobUrl = URL.createObjectURL(blob);
              candidates.push(state.activeBlobUrl);
            }
          } catch (e) {}
        }

        // 3. Direct verified streaming mirrors
        getRemoteUrls(recId, state.surahNum).forEach(function (u) { candidates.push(u); });

        state.currentCandidates = candidates;
        state.candidateIdx = 0;
        els.audio.src = candidates[0];
        els.audio.playbackRate = state.speeds[state.speedIdx];

        var isOffline = candidates[0].indexOf('file://') === 0 || candidates[0].indexOf('blob:') === 0;
        els.playerOfflineBadge.textContent = isOffline ? 'تشغيل بدون نت ✓' : 'بث مباشر';

        if (autoPlay) {
          var p = els.audio.play();
          if (p && typeof p.then === 'function') {
            p.then(function () { setPlayingUI(true); }).catch(function () { setPlayingUI(false); });
          }
        } else {
          setPlayingUI(false);
        }
      }

      function setPlayingUI(playing) {
        state.isPlaying = playing;
        els.iconPlay.classList.toggle('hidden', playing);
        els.iconPause.classList.toggle('hidden', !playing);
        els.eqBadge.classList.toggle('is-animating', playing);
      }

      async function downloadSurahOffline(surahNum) {
        var recId = state.reciter;
        var key = dlKey(recId, surahNum);
        if (state.downloadingMap[key] !== undefined) return;
        var surah = SURAHS[surahNum - 1];
        var urls = getRemoteUrls(recId, surahNum);

        // Native Android downloader
        if (window.AndroidQuranAudio && typeof window.AndroidQuranAudio.downloadSurah === 'function') {
          state.downloadingMap[key] = 5;
          renderList();
          updatePlayerHeader();
          showToast('بدأ تحميل سورة ' + surah.name + ' للعمل بدون نت...');
          window.AndroidQuranAudio.downloadSurah(recId, pad3(surahNum), urls[0], urls[1] || urls[0]);
          return;
        }

        // Browser Cache API downloader
        if (!('caches' in window)) {
          showToast('التحميل المباشر للعمل بدون نت متاح داخل تطبيق الأندرويد APK');
          return;
        }

        state.downloadingMap[key] = 10;
        renderList();
        updatePlayerHeader();
        showToast('جاري حفظ سورة ' + surah.name + ' للاستماع بدون نت...');
        try {
          var resp = null;
          for (var i = 0; i < urls.length; i++) {
            try {
              var r = await fetch(urls[i]);
              if (r.ok) { resp = r; break; }
            } catch (err) {}
          }
          if (!resp) throw new Error('Network error');
          var cache = await caches.open(CACHE_NAME);
          await cache.put(new Request('https://offline.quran.local/' + recId + '/' + pad3(surahNum) + '.mp3'), resp.clone());
          delete state.downloadingMap[key];
          state.downloadedMap[key] = true;
          savePrefs();
          renderList();
          updatePlayerHeader();
          showToast('تم حفظ سورة ' + surah.name + ' بدون نت ✓');
        } catch (e) {
          delete state.downloadingMap[key];
          renderList();
          updatePlayerHeader();
          showToast('تعذّر التحميل حالياً — تأكد من الاتصال بالإنترنت');
        }
      }

      window.onNativeDownloadUpdate = function (recId, surahNum, pct) {
        var key = dlKey(recId, surahNum);
        if (pct >= 100) {
          delete state.downloadingMap[key];
          state.downloadedMap[key] = true;
          savePrefs();
          showToast('تم حفظ سورة ' + SURAHS[surahNum - 1].name + ' بدون نت ✓');
        } else if (pct < 0) {
          delete state.downloadingMap[key];
          showToast('تعذّر تحميل السورة — تحقق من الاتصال بالإنترنت');
        } else {
          state.downloadingMap[key] = pct;
        }
        renderList();
        updatePlayerHeader();
      };

      function updatePlayerHeader() {
        var s = SURAHS[state.surahNum - 1];
        var rec = RECITERS[state.reciter];
        els.playerReciterName.textContent = rec.name;
        els.playerSurahTitle.textContent = 'سورة ' + s.name;
        els.playerSurahMeta.textContent = s.type + ' • ' + toArabicDigits(s.ayahs) + ' آية • رقم السورة ' + toArabicDigits(s.number);

        var isFav = state.favorites.indexOf(s.number) !== -1;
        els.btnToggleFavCurrent.textContent = isFav ? '★ في المفضلة' : '☆ مفضلة';
        els.btnToggleFavCurrent.style.color = isFav ? 'var(--gold)' : '';
        els.btnToggleFavCurrent.style.borderColor = isFav ? 'var(--gold)' : '';

        var key = dlKey(state.reciter, s.number);
        var isOff = isSurahOffline(state.reciter, s.number);
        var prog = state.downloadingMap[key];
        if (prog !== undefined) {
          els.playerDownloadIcon.textContent = '⏳';
          els.playerDownloadText.textContent = 'جاري الحفظ ' + toArabicDigits(prog) + '٪';
        } else if (isOff) {
          els.playerDownloadIcon.textContent = '✓';
          els.playerDownloadText.textContent = 'محفوظة بدون نت';
        } else {
          els.playerDownloadIcon.textContent = '⬇';
          els.playerDownloadText.textContent = 'حفظ بدون نت';
        }
      }

      function renderList() {
        var q = normalizeArabic(state.search);
        var offlineCount = 0;
        SURAHS.forEach(function (s) {
          if (isSurahOffline(state.reciter, s.number)) offlineCount++;
        });
        els.offlineCountBadge.textContent = toArabicDigits(offlineCount);

        var filtered = SURAHS.filter(function (s) {
          if (state.filter === 'offline' && !isSurahOffline(state.reciter, s.number)) return false;
          if (state.filter === 'fav' && state.favorites.indexOf(s.number) === -1) return false;
          if (!q) return true;
          return normalizeArabic(s.name).indexOf(q) !== -1 || String(s.number) === q || toArabicDigits(s.number) === state.search.trim();
        });

        if (!filtered.length) {
          els.surahList.innerHTML = '<div class="col-span-full text-center py-10 text-sm" style="color: var(--text-secondary);">لا توجد سور مطابقة في هذه القائمة حالياً.</div>';
          return;
        }

        els.surahList.innerHTML = filtered.map(function (s) {
          var active = s.number === state.surahNum;
          var isOff = isSurahOffline(state.reciter, s.number);
          var isFav = state.favorites.indexOf(s.number) !== -1;
          var prog = state.downloadingMap[dlKey(state.reciter, s.number)];
          return (
            '<div class="surah-row rounded-2xl p-3 flex items-center justify-between gap-2.5 ' + (active ? 'is-playing' : '') + '">' +
              '<button type="button" data-play-surah="' + s.number + '" class="flex items-center gap-3 min-w-0 flex-1 text-right">' +
                '<span class="w-10 h-10 rounded-xl flex items-center justify-center text-xs font-extrabold shrink-0" style="background-color:' + (active ? 'var(--accent)' : 'var(--gold-soft)') + '; color:' + (active ? '#fff' : 'var(--gold)') + ';">' +
                  (active && state.isPlaying ? '❚❚' : toArabicDigits(s.number)) +
                '</span>' +
                '<div class="min-w-0">' +
                  '<div class="text-sm sm:text-base font-bold truncate">سورة ' + s.name + '</div>' +
                  '<div class="text-[11px]" style="color: var(--text-secondary);">' + s.type + ' • ' + toArabicDigits(s.ayahs) + ' آية' + (isOff ? ' • <span style="color:var(--accent);font-weight:700;">بدون نت ✓</span>' : '') + '</div>' +
                '</div>' +
              '</button>' +
              '<div class="flex items-center gap-1.5 shrink-0">' +
                '<button type="button" data-fav-surah="' + s.number + '" title="إضافة للمفضلة" class="btn-subtle rounded-xl w-9 h-9 text-sm flex items-center justify-center" style="' + (isFav ? 'color:var(--gold);border-color:var(--gold);' : '') + '">' + (isFav ? '★' : '☆') + '</button>' +
                '<button type="button" data-dl-surah="' + s.number + '" title="' + (isOff ? 'محفوظة بدون نت' : 'تحميل للاستماع بدون نت') + '" class="btn-subtle rounded-xl px-2.5 h-9 text-xs font-bold flex items-center justify-center" style="' + (isOff ? 'color:var(--accent);border-color:var(--accent);' : '') + '">' +
                  (prog !== undefined ? (toArabicDigits(prog) + '٪') : (isOff ? '✓' : '⬇')) +
                '</button>' +
              '</div>' +
            '</div>'
          );
        }).join('');
      }

      function applyTheme(t) {
        state.theme = t;
        document.documentElement.setAttribute('data-theme', t);
        els.themeLabel.textContent = t === 'dark' ? 'نهاري' : 'ليلي';
        savePrefs();
      }

      function selectReciter(recId) {
        state.reciter = recId;
        document.querySelectorAll('.reciter-card').forEach(function (card) {
          card.classList.toggle('is-selected', card.getAttribute('data-reciter') === recId);
        });
        savePrefs();
        syncOfflineInventory();
        playSurah(state.surahNum, state.isPlaying);
        showToast('تم اختيار: ' + RECITERS[recId].name);
      }

      // Events
      document.querySelectorAll('.reciter-card').forEach(function (card) {
        card.addEventListener('click', function () {
          selectReciter(card.getAttribute('data-reciter'));
        });
      });

      els.btnToggleTheme.addEventListener('click', function () {
        applyTheme(state.theme === 'dark' ? 'light' : 'dark');
      });

      els.btnSleepTimer.addEventListener('click', function () {
        var opts = [0, 15, 30, 60];
        var next = opts[(opts.indexOf(state.sleepMinutes) + 1) % opts.length];
        state.sleepMinutes = next;
        if (state.sleepTimerId) {
          clearTimeout(state.sleepTimerId);
          state.sleepTimerId = null;
        }
        if (next === 0) {
          els.sleepTimerLabel.textContent = 'المؤقت';
          showToast('تم إلغاء مؤقت النوم');
        } else {
          els.sleepTimerLabel.textContent = toArabicDigits(next) + ' د';
          showToast('سيتوقف التشغيل تلقائياً بعد ' + toArabicDigits(next) + ' دقيقة');
          state.sleepTimerId = setTimeout(function () {
            els.audio.pause();
            setPlayingUI(false);
            state.sleepMinutes = 0;
            els.sleepTimerLabel.textContent = 'المؤقت';
            showToast('انتهى مؤقت النوم وتم إيقاف التلاوة');
          }, next * 60 * 1000);
        }
      });

      els.btnPlayPause.addEventListener('click', function () {
        if (state.isPlaying) {
          els.audio.pause();
          setPlayingUI(false);
        } else {
          if (!els.audio.src) {
            playSurah(state.surahNum, true);
          } else {
            els.audio.play().then(function () { setPlayingUI(true); }).catch(function () {
              playSurah(state.surahNum, true);
            });
          }
        }
      });

      els.btnPrevSurah.addEventListener('click', function () {
        if (state.surahNum > 1) playSurah(state.surahNum - 1, true);
      });

      els.btnNextSurah.addEventListener('click', function () {
        if (state.surahNum < 114) playSurah(state.surahNum + 1, true);
      });

      els.btnBack15.addEventListener('click', function () {
        if (isFinite(els.audio.currentTime)) els.audio.currentTime = Math.max(0, els.audio.currentTime - 15);
      });

      els.btnFwd15.addEventListener('click', function () {
        if (isFinite(els.audio.duration)) els.audio.currentTime = Math.min(els.audio.duration, els.audio.currentTime + 15);
      });

      els.btnSpeed.addEventListener('click', function () {
        state.speedIdx = (state.speedIdx + 1) % state.speeds.length;
        var spd = state.speeds[state.speedIdx];
        els.audio.playbackRate = spd;
        els.btnSpeed.textContent = spd + 'x';
      });

      els.btnRepeatMode.addEventListener('click', function () {
        state.repeatMode = (state.repeatMode + 1) % 3;
        var labels = ['متتالي', 'تكرار السورة', 'إيقاف بعد السورة'];
        els.btnRepeatMode.textContent = labels[state.repeatMode];
        savePrefs();
        showToast('وضع التشغيل: ' + labels[state.repeatMode]);
      });

      els.btnToggleFavCurrent.addEventListener('click', function () {
        var idx = state.favorites.indexOf(state.surahNum);
        if (idx === -1) state.favorites.push(state.surahNum);
        else state.favorites.splice(idx, 1);
        savePrefs();
        updatePlayerHeader();
        renderList();
      });

      els.btnPlayerDownload.addEventListener('click', function () {
        downloadSurahOffline(state.surahNum);
      });

      els.btnDownloadShortSurahs.addEventListener('click', function () {
        var popular = [1, 18, 36, 56, 67, 112, 113, 114];
        popular.forEach(function (num) {
          if (!isSurahOffline(state.reciter, num)) downloadSurahOffline(num);
        });
      });

      els.seekBar.addEventListener('input', function () {
        if (isFinite(els.audio.duration) && els.audio.duration > 0) {
          els.audio.currentTime = (Number(els.seekBar.value) / 100) * els.audio.duration;
        }
      });

      els.audio.addEventListener('timeupdate', function () {
        els.timeCurrent.textContent = formatTime(els.audio.currentTime);
        if (isFinite(els.audio.duration) && els.audio.duration > 0) {
          els.timeTotal.textContent = formatTime(els.audio.duration);
          els.seekBar.value = String((els.audio.currentTime / els.audio.duration) * 100);
        }
      });

      els.audio.addEventListener('ended', function () {
        if (state.repeatMode === 1) {
          els.audio.currentTime = 0;
          els.audio.play().catch(function () {});
        } else if (state.repeatMode === 0 && state.surahNum < 114) {
          playSurah(state.surahNum + 1, true);
        } else {
          setPlayingUI(false);
        }
      });

      els.audio.addEventListener('error', function () {
        if (state.candidateIdx + 1 < state.currentCandidates.length) {
          state.candidateIdx += 1;
          els.audio.src = state.currentCandidates[state.candidateIdx];
          if (state.isPlaying) els.audio.play().catch(function () {});
        } else {
          setPlayingUI(false);
          els.playerOfflineBadge.textContent = 'السورة غير محفوظة بدون نت بعد';
        }
      });

      els.searchInput.addEventListener('input', function (e) {
        state.search = e.target.value;
        renderList();
      });

      document.querySelectorAll('.filter-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          state.filter = btn.getAttribute('data-filter');
          document.querySelectorAll('.filter-btn').forEach(function (b) {
            b.className = 'filter-btn px-3 py-1.5 rounded-xl text-xs font-bold ' + (b === btn ? 'tab-active' : 'tab-inactive');
          });
          renderList();
        });
      });

      els.surahList.addEventListener('click', function (e) {
        var playBtn = e.target.closest('[data-play-surah]');
        if (playBtn) {
          var sNum = Number(playBtn.getAttribute('data-play-surah'));
          if (sNum === state.surahNum && state.isPlaying) {
            els.audio.pause();
            setPlayingUI(false);
          } else {
            playSurah(sNum, true);
          }
          return;
        }
        var favBtn = e.target.closest('[data-fav-surah]');
        if (favBtn) {
          var fNum = Number(favBtn.getAttribute('data-fav-surah'));
          var idx = state.favorites.indexOf(fNum);
          if (idx === -1) state.favorites.push(fNum);
          else state.favorites.splice(idx, 1);
          savePrefs();
          updatePlayerHeader();
          renderList();
          return;
        }
        var dlBtn = e.target.closest('[data-dl-surah]');
        if (dlBtn) {
          downloadSurahOffline(Number(dlBtn.getAttribute('data-dl-surah')));
        }
      });

      // Init
      loadPrefs();
      applyTheme(state.theme);
      document.querySelectorAll('.reciter-card').forEach(function (card) {
        card.classList.toggle('is-selected', card.getAttribute('data-reciter') === state.reciter);
      });
      var repLabels = ['متتالي', 'تكرار السورة', 'إيقاف بعد السورة'];
      els.btnRepeatMode.textContent = repLabels[state.repeatMode] || 'متتالي';
      syncOfflineInventory();
      playSurah(state.surahNum, false);
    })();
  </script>
</body>
</html>
